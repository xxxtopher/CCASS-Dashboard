name: Daily CCASS + price update
# Runs on HK trading days after the close. CCASS holdings are published
# overnight, so fetch in the early morning HKT; price is fetched too.
# Commits data/*.json back to the repo, and GitHub Pages serves them.
#
# SCHEDULING NOTE (2026-11-17): GitHub's scheduler fired this job 3.5–6.5h
# late every night Nov 9–16 — the run is only *created* hours after the
# slot, while the job itself takes ~1 min once it starts. Nothing in this
# file causes that: the cron is valid and registered, there is no
# concurrency block or skip condition, and the repo is active (daily bot
# commits), so the delay is on GitHub's side and GitHub gives no SLA for
# scheduled runs. Instead of a single trigger, fire every 30 min across
# 21:00–23:30 UTC and let the first run that actually starts do the work:
# the check step below skips the fetch when both stocks already have the
# target date, so later triggers exit in seconds and nothing is fetched
# twice. The fetch itself is idempotent (dates already in the history are
# skipped), so a late duplicate run can never add duplicate data.
on:
  schedule:
    - cron: "*/30 21-23 * * 1-5"   # 21:00–23:30 UTC Mon–Fri = 05:00–07:30 HKT; first firing run fetches, the rest no-op (see check step)
  workflow_dispatch:
    inputs:
      code:
        description: "HK stock codes (space-separated)"
        default: "2501 2497"
        required: true
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check if this date is already fetched
        id: check
        env:
          CODES: ${{ inputs.code || '2501 2497' }}
        run: |
          # Target date is yesterday HKT for every trigger in the window
          # (the HKT date only changes at 16:00 UTC, so all triggers in
          # 21:00–23:30 UTC target the same day). If every stock already
          # has it, there is nothing to do and the fetch step is skipped.
          # A failed fetch does NOT mark the date done, so the next
          # trigger retries it.
          TARGET=$(TZ=Asia/Hong_Kong date -d 'yesterday' +%Y-%m-%d)
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          NEEDED=false
          for CODE in $CODES; do
            HAVE=$(python3 -c "import json; print(json.load(open('data/ccass_latest_${CODE}.json'))['date'])" 2>/dev/null || echo none)
            echo "$CODE: have $HAVE, target $TARGET"
            [ "$HAVE" != "$TARGET" ] && NEEDED=true
          done
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"
      - name: Fetch price + CCASS + news
        if: steps.check.outputs.needed == 'true'
        env:
          CODES: ${{ inputs.code || '2501 2497' }}
        run: |
          # CCASS holdings for a date are published overnight AFTER the close,
          # so at 05:30 HKT the latest available day is yesterday HKT, not
          # today. Asking HKEX for today returns the empty search form and
          # the fetch fails (both Nov 10 runs proved this: only price files
          # were committed). --backfill 3 also fills any day missed earlier
          # (HKEX outage / HK holiday); dates already in the history are skipped.
          CCASS_DATE=$(TZ=Asia/Hong_Kong date -d 'yesterday' +%Y-%m-%d)
          echo "Fetching CCASS for $CCASS_DATE"
          for CODE in $CODES; do
            python3 scripts/fetch_price.py "$CODE"
            python3 scripts/fetch_ccass.py "$CODE" "$CCASS_DATE" --backfill 3 || echo "CCASS fetch failed for $CODE (HKEX maintenance / form change?) - price still committed"
            python3 scripts/fetch_news.py "$CODE" || echo "News fetch failed for $CODE - old news file stays"
          done
      - name: Commit data
        run: |
          git config user.name "ccass-bot"
          git config user.email "ccass-bot@users.noreply.github.com"
          rm -f data/_last_hkex_debug.html
          git add data/
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git push || echo "push failed (another run may have committed first) - data already in repo"
