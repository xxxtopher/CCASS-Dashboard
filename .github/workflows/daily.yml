name: Daily CCASS + price update
# Runs on HK trading days after the close. CCASS holdings are published
# overnight, so fetch in the early morning HKT; price is fetched too.
# Commits data/*.json back to the repo, and GitHub Pages serves them.
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 05:30 HKT Tue-Sat = after Mon-Fri close (UTC 21:30); moved from 06:30 HKT 2026-11-12 — the data is on HKEX by ~04:30 HKT, and the earlier slot gives the 22:50 UTC summary more buffer
  workflow_dispatch:
    inputs:
      code:
        description: "HK stock codes (space-separated)"
        default: "2501 2497"
        required: true
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch price + CCASS + news
        env:
          CODES: ${{ inputs.code || '2501 2497' }}
        run: |
          # CCASS holdings for a date are published overnight AFTER the close,
          # so at 05:30 HKT the latest available day is yesterday HKT, not
          # today. Asking HKEX for today returns the empty search form and
          # the fetch fails (both Nov 10 runs proved this: only price files
          # were committed). --backfill 3 also fills any day missed earlier
          # (HKEX outage / HK holiday); dates already in the history are skipped.
          CCASS_DATE=$(TZ=Asia/Hong_Kong date -d 'yesterday' +%Y-%m-%d)
          echo "Fetching CCASS for $CCASS_DATE"
          for CODE in $CODES; do
            python3 scripts/fetch_price.py "$CODE"
            python3 scripts/fetch_ccass.py "$CODE" "$CCASS_DATE" --backfill 3 || echo "CCASS fetch failed for $CODE (HKEX maintenance / form change?) - price still committed"
            python3 scripts/fetch_news.py "$CODE" || echo "News fetch failed for $CODE - old news file stays"
          done
      - name: Commit data
        run: |
          git config user.name "ccass-bot"
          git config user.email "ccass-bot@users.noreply.github.com"
          rm -f data/_last_hkex_debug.html
          git add data/
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git push
